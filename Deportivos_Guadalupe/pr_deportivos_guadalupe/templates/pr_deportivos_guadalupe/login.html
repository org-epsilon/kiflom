{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deportivos Guadalupe - Iniciar Sesión</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'home' %}"><span class="brand-mark"></span>Deportivos Guadalupe</a>
        <nav class="site-nav" aria-label="Navegación principal">
            <a href="{% url 'home' %}">Inicio</a>
        </nav>
    </header>

    <main class="login-page">
        <section class="login-card">
            <p class="eyebrow">Acceso restringido</p>
            <h1>Entrar al garaje</h1>
            <p>Identifícate para acceder al panel de control de Deportivos Guadalupe.</p>

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" value="admin_guadalupe" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" value="v8biturbo2026" required>
                </div>

                <button type="submit" class="button btn-login">Ingresar al garaje</button>
            </form>
            <a class="back-link" href="{% url 'home' %}">Volver al inicio</a>
        </section>
    </main>

</body>
</html>
